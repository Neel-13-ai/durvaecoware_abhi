<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="meal2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3e2"/>
      <stop offset="60%" stop-color="#dfbe8a"/>
      <stop offset="100%" stop-color="#be9655"/>
    </linearGradient>
    <filter id="mealShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#3c2a10" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="40" y="80" width="220" height="150" rx="14" fill="url(#meal2Grad)" filter="url(#mealShadow)" stroke="#a17d41" stroke-width="2.5"/>
  <!-- 2 Compartment Divider Line -->
  <line x1="145" y1="80" x2="145" y2="230" stroke="#8c682c" stroke-width="3"/>
  <!-- Left Side Details -->
  <rect x="52" y="92" width="80" height="126" rx="8" fill="#e8cf9f" opacity="0.4" stroke="#ad8847" stroke-width="1.5"/>
  <!-- Right Side Details -->
  <rect x="157" y="92" width="91" height="126" rx="8" fill="#e8cf9f" opacity="0.4" stroke="#ad8847" stroke-width="1.5"/>
  <text x="92" y="160" text-anchor="middle" fill="#58401e" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700">PORTION 1</text>
  <text x="202" y="160" text-anchor="middle" fill="#58401e" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700">PORTION 2</text>
  <text x="150" y="260" text-anchor="middle" fill="#58401e" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800">750 ML 2-COMPARTMENT</text>
</svg>
